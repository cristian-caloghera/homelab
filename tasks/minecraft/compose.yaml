services:
  vanilla:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      ENABLE_ROLLING_LOGS: "TRUE"
      LOG_TIMESTAMP: "TRUE"
      ENABLE_WHITELIST: "true"
      WHITELIST: |-
        Gamerogog
        Pixelwolf075268
        rexilei
      OPS: |
        Pixelwolf075268
    volumes:
      - ./data:/data
    networks:
      - minecraft
# another server
#  forge:
#    image: itzg/minecraft-server
#    environment:
#      EULA: "TRUE"
#      TYPE: FORGE
  router:
    image: itzg/mc-router
    depends_on:
      - vanilla
    environment:
      MAPPING: |
        mc-test=vanilla:25565
        mc-banane.burunet.lol=vanilla:25565
        mc-banane.burunet.dedyn.io=vanilla:25565
    ports:
      - "25565:25565"
    networks:
      - minecraft

networks:
  minecraft:
    external: true

# apparently this will reload the config without a server restart
# mc-image-helper sync --skip-newer-in-destination /config /data/config
# Link: https://github.com/itzg/docker-minecraft-server/discussions/1279